name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-windows-msvc
          - name: macOS arm64
            runner: macos-15
            target: aarch64-macos

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Cache Zig compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .zig-cache
            !.zig-cache/tmp
            !.zig-cache/global/tmp
          key: zig-${{ matrix.runner }}-${{ matrix.target }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'build_support/agentcore-bundle.*.lock.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ matrix.runner }}-${{ matrix.target }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'build_support/agentcore-bundle.*.lock.json', 'package-lock.json') }}-

      - name: Prepare Zig cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE '.zig-cache/global'
          New-Item -ItemType Directory -Force (Join-Path $cache 'tmp') | Out-Null
          "ZIG_GLOBAL_CACHE_DIR=$cache" >> $env:GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Stage locked AgentCore bundle
        run: node scripts/download-agentcore-bundle.mjs ${{ matrix.target }}

      - name: Check formatting
        run: npm run format:check

      - name: Check repository
        run: npm run check

      - name: Run repository tests
        run: npm test
