name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  # packaging/windows/metawork.iss includes a language file that ships only
  # with Inno Setup 7, so the 6.7.1 the runner image preinstalls cannot build
  # this installer at all. Same URL and digest as release.yml, which is also
  # the version the release machine uses; the duplication is two workflows
  # naming one pinned dependency, not two policies.
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNO_SETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - &setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - &setup-zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # `npm ci` writes 245 MB across 15,010 files, which costs 2.2 to 2.9
      # minutes on Windows and about half a minute elsewhere, on every leg.
      # Restoring that tree took 5 seconds on both platforms instead, measured
      # on 2026-11-17 across two attempts of one commit. The key carries the
      # runner because the tree holds platform-specific optional binaries, and
      # the lock file because that is what decides its contents, which makes
      # this three entries of 46 MB in a cache budget that has been at its
      # limit.
      - &cache-node-modules
        name: Cache installed npm dependencies
        id: node-modules-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - &npm-ci
        name: Install npm dependencies
        # Skipped on a hit: `npm ci` deletes node_modules before installing, so
        # running it over a restored tree would throw the restore away. A job
        # without the cache step above has no such output, so it still installs.
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Renderer TypeScript
        run: npm --workspace @metawork/renderer run typecheck

  node-tests:
    name: Node tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy: &platforms
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-windows-msvc
            lock: build_support/agentcore-bundle.windows-x86_64.lock.json
          # One image behind the macos-26 release.yml and the packaging job
          # pin, deliberately, and not a drift to reconcile: the application's
          # declared macOS baseline is 13.0, no hosted image runs 13 any more,
          # so the test jobs take the oldest image that still exists. The
          # packaging legs are pinned forward instead because the Icon Composer
          # gate only accepts reviewed actool builds. Neither image covers 13.0
          # itself, which docs/validation.md still carries as an open gap.
          - name: macOS arm64
            runner: macos-15
            target: aarch64-macos
            lock: build_support/agentcore-bundle.macos-aarch64.lock.json

    steps:
      - *checkout
      - *setup-node
      - *setup-zig

      - &cache-zig-packages
        name: Cache Zig dependency packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache/global/p
          key: zig-packages-${{ matrix.runner }}-${{ matrix.target }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', matrix.lock, 'package-lock.json') }}

      - &prepare-zig-cache
        name: Prepare Zig cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE '.zig-cache/global'
          New-Item -ItemType Directory -Force (Join-Path $cache 'tmp') | Out-Null
          "ZIG_GLOBAL_CACHE_DIR=$cache" >> $env:GITHUB_ENV

      - *cache-node-modules
      - *npm-ci

      - &stage-agentcore
        name: Stage locked AgentCore bundle
        run: node scripts/stage-agentcore-bundle.mjs ${{ matrix.target }}

      - name: Run Node tests
        run: npm run test:node

  native-tests:
    name: Native tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Every timeout in this workflow is about twice the job's measured wall
    # clock rather than a value to give up at, so a job that has stopped making
    # progress is reported in minutes instead of holding a runner until a round
    # number expires. This graph measures 10.6 minutes on Windows and 11.3 on
    # macOS with a warm compilation cache and 12.9 with an empty one, on
    # 2026-11-17, so 30 keeps more than double the cold-cache time; the 60 it
    # replaces meant an hour of runner time per hang.
    timeout-minutes: 30
    strategy: *platforms
    steps:
      - *checkout
      - *setup-node
      - *setup-zig

      - name: Restore Native compilation cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: &native-cache-path |
            .zig-cache/b
            .zig-cache/c
            .zig-cache/h
            .zig-cache/o
            .zig-cache/z
            .zig-cache/global/b
            .zig-cache/global/c
            .zig-cache/global/h
            .zig-cache/global/o
            .zig-cache/global/z
          key: zig-native-${{ matrix.runner }}-${{ matrix.target }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', matrix.lock, 'package-lock.json') }}

      - *cache-zig-packages
      - *prepare-zig-cache
      - *cache-node-modules
      - *npm-ci
      - *stage-agentcore

      - name: Run strict Native SDK checks
        run: npm run check:sdk

      - name: Run the full Native test graph
        run: npm run test:native

      - name: Save Native compilation cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: *native-cache-path
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  packaging:
    name: Unsigned package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Twice the 10 minutes the Windows installer measures on this image. The
    # release job allows 45 because it also signs and notarizes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Its own matrix rather than *platforms, for two reasons: the packaging
      # scripts take an architecture the test jobs have no field for, and this
      # job's macOS leg has to be macos-26 while the test jobs deliberately
      # stay on macos-15. One architecture per platform is what a gate needs,
      # because the remaining two are built from these same scripts on these
      # same images by release.yml, and what breaks is the shared path.
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            architecture: x64
            script: package:windows
            target: x86_64-windows-msvc
            lock: build_support/agentcore-bundle.windows-x86_64.lock.json
          # macos-26 because scripts/package-macos.mjs compiles the app icon
          # through Icon Composer, whose gate accepts only actool builds that
          # have been reviewed, and this image's default Xcode 26.6 reports one
          # of them. If that image's default Xcode moves, this leg is supposed
          # to fail by name rather than package a different icon quietly.
          - name: macOS arm64
            runner: macos-26
            architecture: arm64
            script: package:macos
            target: aarch64-macos
            lock: build_support/agentcore-bundle.macos-aarch64.lock.json

    steps:
      - *checkout
      - *setup-node
      - *setup-zig

      # Dependency packages only, and no compilation cache of its own: the
      # repository is already over the 10 GB Actions cache limit, and this job
      # runs beside the native tests, which take longer than a cold packaging
      # build, so compiling from nothing costs the run no wall clock.
      - *cache-zig-packages
      - *prepare-zig-cache
      - *cache-node-modules
      - *npm-ci
      - *stage-agentcore

      - name: Install the pinned Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          curl.exe --fail --location --silent --show-error --output $installer $env:INNO_SETUP_URL
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          $expected = $env:INNO_SETUP_SHA256.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Inno Setup download digest is $actual, expected $expected"
          }
          # The installer is a GUI program, so the call operator would not wait
          # for it and the next step would look for a compiler that is still
          # being written.
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS'
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with $($process.ExitCode)"
          }
          $location = $null
          foreach ($key in @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 7_is1',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 7_is1'
          )) {
            $entry = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
            if ($entry -and $entry.InstallLocation) {
              $location = $entry.InstallLocation
              break
            }
          }
          if (-not $location) { throw 'Inno Setup 7 registered no install location' }
          $compiler = Join-Path $location 'ISCC.exe'
          # Asserted by name rather than left to ISCC, so a compiler without
          # the language files the installer script requires fails here with
          # the reason instead of inside a compile log.
          $language = Join-Path $location 'Languages\ChineseSimplified.isl'
          foreach ($required in @($compiler, $language)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Inno Setup 7 install is missing $required"
            }
          }
          # Pointing the packaging script at this exact compiler settles the
          # discovery order, so the image's preinstalled Inno Setup 6 cannot be
          # reached through PATH and fail the gate for the wrong reason.
          "METAWORK_INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
          & $compiler /? | Select-Object -First 1

      # Unsigned on both platforms: it is the Windows script's own default and
      # the macOS script's explicit mode, so this is the release path with
      # nothing removed from it except the parts that need the certificate.
      # Until now that path ran only on one developer's machine, and both
      # defects it has produced were found by hand after a tag was pushed.
      #
      # `shell: bash` is load-bearing: it is the only way this step gets
      # pipefail, and without it tee's exit code would swallow a failed
      # packaging run. On Windows it also has to displace the default pwsh.
      - name: Build the unsigned package
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PACKAGE_SCRIPT: ${{ matrix.script }}
        run: |
          npm run "$PACKAGE_SCRIPT" -- "$ARCHITECTURE" --signing none 2>&1 | tee package.log

      # Reporting only; there is no size assertion here or in the packaging
      # scripts. Putting the measurement in the run summary is what makes a
      # drifting package visible on the pull request that moves it, rather than
      # five releases later.
      - name: Report the packaged artifact
        if: always()
        shell: bash
        env:
          LEG: ${{ matrix.name }}
        run: |
          {
            printf '### %s\n\n' "$LEG"
            line=$(grep -E '^built unsigned ' package.log 2>/dev/null | tail -1 || true)
            if [[ -n "$line" ]]; then
              printf -- '- %s\n' "${line#built }"
            else
              printf -- '- No packaging result was produced; the run did not reach the end.\n'
            fi
            printf -- '- Unsigned and unnotarized: a verification artifact, never a release artifact.\n'
          } >> "$GITHUB_STEP_SUMMARY"
